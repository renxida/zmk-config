# USB device stack (CDC ACM + DTE-rate callback are selected by the module)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Cradio Touch Test"
CONFIG_USB_DEVICE_SN="E1A2B3C4D5E6F708"
CONFIG_SERIAL=y

# Logging so the host harness can observe the trigger
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# The feature under test, in detect-only mode (no retention HW on native_sim)
CONFIG_USB_BOOTLOADER_TOUCH=y
CONFIG_USB_BOOTLOADER_TOUCH_TEST_NO_REBOOT=y
CONFIG_USB_BOOTLOADER_TOUCH_LOG_LEVEL_DBG=y
