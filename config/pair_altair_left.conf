# Altair pair — Altair L half. Self-contained per-build conf (single EXTRA_CONF_FILE).
CONFIG_USB_BOOTLOADER_TOUCH=y
CONFIG_HWINFO=y
CONFIG_USB_DEVICE_SN="0123456789ABCDEF"
CONFIG_USB_DEVICE_PRODUCT="Altair L"
# Per-pair BLE/keyboard name → distinct device name to the host.
CONFIG_ZMK_KEYBOARD_NAME="Altair"
# Reflect the active BLE profile in the advertised name ("<base>-P<n>"); also
# force-overrides any stale NVS-persisted name on reflash.
CONFIG_ZMK_BLE_NAME_PROFILE=y
CONFIG_BT_DEVICE_NAME_MAX=28
# Split battery: central fetches the peripheral (right half) battery over the
# split link and re-exposes it as an extra BLE Battery Service so hosts/tools
# can read the right half's level (central-only; right half reports by default).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
