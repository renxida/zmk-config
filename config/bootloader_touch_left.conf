# Touch + identity config for the LEFT half (referenced via EXTRA_CONF_FILE for
# the cradio_left build only). Self-contained to avoid multi-file EXTRA_CONF
# quoting issues in the CI shell.
CONFIG_USB_BOOTLOADER_TOUCH=y

# Running USB serial = nRF FICR.DEVICEID (host identifies the half by it).
CONFIG_HWINFO=y
CONFIG_USB_DEVICE_SN="0123456789ABCDEF"

# Per-side product string so `kbd-flash list` and product-fallback calibration
# can tell the halves apart without one-at-a-time calibration.
CONFIG_USB_DEVICE_PRODUCT="Cradio L"
