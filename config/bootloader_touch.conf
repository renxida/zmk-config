# Enable host-triggered UF2 bootloader entry via 1200-baud CDC touch.
# Applied only to the cradio builds (via EXTRA_CONF_FILE in build.yaml), so the
# unknown-symbol risk never reaches settings_reset.
CONFIG_USB_BOOTLOADER_TOUCH=y

# Expose the nRF52840 FICR.DEVICEID as the USB serial number so the host can
# identify each running half (kbd-flash calibration maps serial -> side). The
# stack overwrites this 16-hex placeholder with hwinfo_get_device_id() (8 bytes
# -> 16 hex) at USB init.
CONFIG_HWINFO=y
CONFIG_USB_DEVICE_SN="0123456789ABCDEF"
